name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      # The theme compiler reads Radzen SCSS partials. Pin its source snapshot;
      # checking out an advancing branch would make CSS reproducibility meaningless.
      - name: Checkout Radzen theme source
        uses: actions/checkout@v4
        with:
          repository: radzenhq/radzen-blazor
          ref: 3fdccdd9071fe6b4ec3ec6fe990f3b8dd5f32d2f
          path: radzen-source
          persist-credentials: false

      - name: Exclude external theme source from repository dirtiness checks
        run: echo '/radzen-source/' >> .git/info/exclude

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Install CI tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ripgrep unzip

      - name: Regenerate theme CSS and check tracked output
        env:
          RADZEN_SOURCE_ROOT: ${{ github.workspace }}/radzen-source
        run: |
          mkdir -p artifacts/packages/admiral
          tools/admiral/rebuild-admiral-theme.sh
          git diff --exit-code -- Radzen.AdmiralThemes/wwwroot/css

      - name: Build and verify three NuGet packages
        run: tools/admiral/build-admiral-packages.sh --configuration Release

      - name: Restore solution
        run: dotnet restore Radzen.Admiral.slnx

      - name: Verify package dependency graph
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          import zipfile

          root = Path('.')
          packages = {
              'AdmiralRadzen.Icons': root / 'Radzen.AdmiralIcons',
              'AdmiralRadzen.Themes': root / 'Radzen.AdmiralThemes',
              'AdmiralRadzen.Components': root / 'Radzen.AdmiralComponents',
          }
          versions = {}
          for package_id, directory in packages.items():
              project = ET.parse(next(directory.glob('*.csproj'))).getroot()
              versions[package_id] = project.findtext('./PropertyGroup/Version')
              assert versions[package_id], f'{package_id}: missing project version'

          for package_id, version in versions.items():
              archive = root / 'artifacts/packages/admiral' / f'{package_id}.{version}.nupkg'
              assert archive.is_file(), f'Missing local package: {archive}'
              with zipfile.ZipFile(archive) as package:
                  nuspec = ET.fromstring(package.read(f'{package_id}.nuspec'))
              ns = {'n': nuspec.tag.partition('}')[0].lstrip('{')}
              assert nuspec.findtext('./n:metadata/n:id', namespaces=ns) == package_id
              assert nuspec.findtext('./n:metadata/n:version', namespaces=ns) == version
              dependencies = {node.attrib['id']: node.attrib['version']
                              for node in nuspec.findall('.//n:dependency', ns)}
              if package_id == 'AdmiralRadzen.Components':
                  for dependency in ('AdmiralRadzen.Icons', 'AdmiralRadzen.Themes'):
                      assert dependencies.get(dependency) == versions[dependency], (
                          f'{package_id}: {dependency} must use local version {versions[dependency]}')
                  assert dependencies.get('Radzen.Blazor'), 'Components: missing Radzen.Blazor dependency'
              else:
                  assert not any(name.startswith('AdmiralRadzen.') for name in dependencies), (
                      f'{package_id}: unexpected Admiral dependency')
              print(f'{package_id} {version}: {dependencies}')
          PY

      - name: Build solution in Release
        run: dotnet build Radzen.Admiral.slnx --configuration Release

      - name: Publish smoke app from local packages
        env:
          NUGET_PACKAGES: ${{ runner.temp }}/smoke-nuget-cache
        run: |
          dotnet restore samples/AdmiralConsumerSmoke/AdmiralConsumerSmoke.csproj \
            --configfile NuGet.config --force
          dotnet publish samples/AdmiralConsumerSmoke/AdmiralConsumerSmoke.csproj \
            --configuration Release --no-restore --output "$RUNNER_TEMP/smoke-publish"

      - name: Upload local NuGet packages
        uses: actions/upload-artifact@v4
        with:
          name: admiral-packages
          path: artifacts/packages/admiral/*.nupkg
          if-no-files-found: error
          retention-days: 2

      - name: Upload published smoke app
        uses: actions/upload-artifact@v4
        with:
          name: smoke-publish
          path: ${{ runner.temp }}/smoke-publish/
          if-no-files-found: error
          retention-days: 2

      - name: Check generated files and whitespace
        run: |
          git diff --check
          if [ -n "$(git status --porcelain --untracked-files=normal)" ]; then
            git status --short
            echo 'CI commands changed tracked or unignored files.' >&2
            exit 1
          fi

  validate:
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://127.0.0.1:5072
      SMOKE_URL: http://127.0.0.1:5072
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install browser
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Download local NuGet packages
        uses: actions/download-artifact@v4
        with:
          name: admiral-packages
          path: artifacts/packages/admiral

      - name: Download published smoke app
        uses: actions/download-artifact@v4
        with:
          name: smoke-publish
          path: ${{ runner.temp }}/smoke-publish

      - name: Validate isolated NuGet consumer
        run: node tools/admiral/validate-consumer-integration.mjs

      - name: Start smoke app and wait for readiness
        run: |
          (cd "$RUNNER_TEMP/smoke-publish" && dotnet AdmiralConsumerSmoke.dll) >"$RUNNER_TEMP/smoke.log" 2>&1 &
          echo $! >"$RUNNER_TEMP/smoke.pid"
          ready=0
          for attempt in {1..90}; do
            if curl --fail --silent --output /dev/null "$SMOKE_URL/"; then
              ready=1
              break
            fi
            if ! kill -0 "$(cat "$RUNNER_TEMP/smoke.pid")" 2>/dev/null; then
              break
            fi
            sleep 1
          done
          if [ "$ready" -ne 1 ]; then
            cat "$RUNNER_TEMP/smoke.log"
            exit 1
          fi

      - name: Compile rendered copyable Razor examples
        run: node tools/admiral/validate-copyable-razor.mjs --output "$RUNNER_TEMP/copyable-razor"

      - name: Validate published WASM documentation under project subpath
        run: npm run test:wasm

      - name: Verify public licensing and package assets
        run: node tools/admiral/verify-public-release.mjs

      - name: Check generated files and whitespace
        run: |
          git diff --check
          if [ -n "$(git status --porcelain --untracked-files=normal)" ]; then
            git status --short
            echo 'CI commands changed tracked or unignored files.' >&2
            exit 1
          fi

      - name: Stop smoke app
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/smoke.pid" ]; then
            kill "$(cat "$RUNNER_TEMP/smoke.pid")" 2>/dev/null || true
          fi

      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: validation-diagnostics
          if-no-files-found: ignore
          retention-days: 7
          path: |
            ${{ runner.temp }}/smoke.log
            ${{ runner.temp }}/copyable-razor/inventory.json
            ${{ runner.temp }}/copyable-razor/results.json

  browser:
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - group: audit
            scripts: 'test:browser:audit'
          - group: interactions
            scripts: 'test:browser:checkbox test:browser:interactions test:browser:combo test:browser:drawer test:browser:hint test:browser:slider'
          - group: components
            scripts: 'test:browser:phone-number test:browser:select test:browser:visual test:browser:file-input test:browser:image-viewer'
          - group: layout
            scripts: 'test:browser:action-bar test:browser:tree test:browser:native-date-range test:browser:layout test:browser:fonts'
    env:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://127.0.0.1:5072
      SMOKE_URL: http://127.0.0.1:5072
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install browser
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Download published smoke app
        uses: actions/download-artifact@v4
        with:
          name: smoke-publish
          path: ${{ runner.temp }}/smoke-publish

      - name: Start smoke app and wait for readiness
        run: |
          (cd "$RUNNER_TEMP/smoke-publish" && dotnet AdmiralConsumerSmoke.dll) >"$RUNNER_TEMP/smoke.log" 2>&1 &
          echo $! >"$RUNNER_TEMP/smoke.pid"
          ready=0
          for attempt in {1..90}; do
            if curl --fail --silent --output /dev/null "$SMOKE_URL/"; then
              ready=1
              break
            fi
            if ! kill -0 "$(cat "$RUNNER_TEMP/smoke.pid")" 2>/dev/null; then
              break
            fi
            sleep 1
          done
          if [ "$ready" -ne 1 ]; then
            cat "$RUNNER_TEMP/smoke.log"
            exit 1
          fi

      - name: Run ${{ matrix.group }} browser regressions
        run: |
          failed=0
          for suite in ${{ matrix.scripts }}; do
            if ! npm run "$suite"; then
              echo "::error title=Browser regression failed::$suite (${{ matrix.group }})"
              failed=1
            fi
          done
          exit "$failed"

      - name: Stop smoke app
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/smoke.pid" ]; then
            kill "$(cat "$RUNNER_TEMP/smoke.pid")" 2>/dev/null || true
          fi

      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-${{ matrix.group }}-diagnostics
          if-no-files-found: ignore
          retention-days: 7
          path: |
            ${{ runner.temp }}/smoke.log
            artifacts/
